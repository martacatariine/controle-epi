<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de EPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#FAF9F4;
    --surface:#FFFFFF;
    --surface-2:#F1EEE3;
    --ink:#2A2740;
    --ink-muted:#6E6A80;
    --border:#E3DFD1;
    --accent:#6E4E92;
    --accent-ink:#3D2A54;
    --accent-soft:#EFE7F5;
    --vine:#3E7A3D;
    --vine-soft:#E4F1DE;
    --good:#3E7A3D;
    --good-soft:#E4F1DE;
    --warn:#A8681A;
    --warn-soft:#FBEBD3;
    --critical:#AE3B3B;
    --critical-soft:#FAE1DF;
    --shadow:rgba(43,39,64,0.10);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1826;
      --surface:#242030;
      --surface-2:#2C2739;
      --ink:#F1EEF7;
      --ink-muted:#B4AEC9;
      --border:#3B3548;
      --accent:#C3A3E3;
      --accent-ink:#F1E6FA;
      --accent-soft:#3B2E4F;
      --vine:#8FC47E;
      --vine-soft:#28381F;
      --good:#86C476;
      --good-soft:#24361F;
      --warn:#E3A857;
      --warn-soft:#3D2D17;
      --critical:#E08585;
      --critical-soft:#3B2222;
      --shadow:rgba(0,0,0,0.4);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1826;
    --surface:#242030;
    --surface-2:#2C2739;
    --ink:#F1EEF7;
    --ink-muted:#B4AEC9;
    --border:#3B3548;
    --accent:#C3A3E3;
    --accent-ink:#F1E6FA;
    --accent-soft:#3B2E4F;
    --vine:#8FC47E;
    --vine-soft:#28381F;
    --good:#86C476;
    --good-soft:#24361F;
    --warn:#E3A857;
    --warn-soft:#3D2D17;
    --critical:#E08585;
    --critical-soft:#3B2222;
    --shadow:rgba(0,0,0,0.4);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', Georgia, serif;
    text-wrap:balance;
    margin:0;
  }
  .shell{max-width:1180px;margin:0 auto;padding:20px 24px 64px;}

  /* ---------- Header ---------- */
  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    flex-wrap:wrap;
    padding-bottom:18px;margin-bottom:18px;
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:14px;min-width:0;}
  .brand img{height:34px;width:auto;display:block;}
  .brand .titles{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .brand .app-name{font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;letter-spacing:.2px;}
  .brand .app-sub{font-size:.78rem;color:var(--ink-muted);}
  .sync-pill{
    display:inline-flex;align-items:center;gap:7px;
    font-size:.78rem;color:var(--ink-muted);
    padding:5px 12px;border-radius:999px;background:var(--surface-2);
    border:1px solid var(--border);white-space:nowrap;
  }
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;}
  .sync-pill.local .sync-dot{background:var(--warn);}

  nav.tabs{
    display:flex;gap:4px;flex-wrap:wrap;margin-bottom:22px;
    border-bottom:1px solid var(--border);
  }
  nav.tabs button{
    font-family:'Public Sans',sans-serif;
    font-size:.92rem;font-weight:600;
    color:var(--ink-muted);
    background:none;border:none;cursor:pointer;
    padding:10px 16px;border-bottom:2px solid transparent;
    margin-bottom:-1px;
    border-radius:6px 6px 0 0;
    transition:color .15s ease, background .15s ease;
  }
  nav.tabs button:hover{background:var(--surface-2);color:var(--ink);}
  nav.tabs button.active{color:var(--accent-ink);border-bottom-color:var(--accent);background:var(--accent-soft);}

  /* ---------- Generic building blocks ---------- */
  .no-print{}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px;}
  .kpi{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;box-shadow:0 1px 2px var(--shadow);
    border-left:4px solid var(--accent);
  }
  .kpi.tone-warn{border-left-color:var(--warn);}
  .kpi.tone-critical{border-left-color:var(--critical);}
  .kpi .num{font-family:'Fraunces',serif;font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;}
  .kpi .label{margin-top:6px;font-size:.82rem;color:var(--ink-muted);}

  .panels-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:28px;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:0 1px 2px var(--shadow);}
  .panel h3{font-size:1.02rem;margin-bottom:12px;font-weight:600;}
  .alert-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.88rem;}
  .alert-row:last-child{border-bottom:none;}
  .alert-row .meta{color:var(--ink-muted);font-size:.8rem;}
  .empty-msg{color:var(--ink-muted);font-size:.88rem;padding:6px 0;}

  section.tab-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;box-shadow:0 1px 2px var(--shadow);margin-bottom:20px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .section-head h2{font-size:1.25rem;font-weight:600;}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .search-input{
    padding:8px 12px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg);color:var(--ink);font-size:.88rem;min-width:200px;
  }
  .search-input:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .btn{
    font-family:'Public Sans',sans-serif;font-weight:600;font-size:.85rem;
    padding:9px 16px;border-radius:8px;border:1px solid transparent;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-secondary{background:var(--surface-2);color:var(--ink);border-color:var(--border);}
  .btn-secondary:hover{background:var(--border);}
  .btn-ghost{background:none;color:var(--accent-ink);padding:6px 10px;font-size:.82rem;}
  .btn-ghost:hover{background:var(--accent-soft);}
  .btn-danger{background:none;color:var(--critical);padding:6px 10px;font-size:.82rem;}
  .btn-danger:hover{background:var(--critical-soft);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
  table{width:100%;border-collapse:collapse;font-size:.88rem;}
  thead th{
    text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-muted);background:var(--surface-2);padding:10px 12px;font-weight:600;
    white-space:nowrap;
  }
  tbody td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle;}
  tbody tr:hover{background:var(--surface-2);}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .row-actions{display:flex;gap:4px;justify-content:flex-end;}

  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;}
  .chip-good{background:var(--good-soft);color:var(--good);}
  .chip-warn{background:var(--warn-soft);color:var(--warn);}
  .chip-critical{background:var(--critical-soft);color:var(--critical);}
  .chip-neutral{background:var(--surface-2);color:var(--ink-muted);}

  /* ---------- Forms / dialogs ---------- */
  dialog{
    border:none;border-radius:14px;padding:0;max-width:480px;width:92vw;
    background:var(--surface);color:var(--ink);box-shadow:0 12px 40px var(--shadow);
  }
  dialog::backdrop{background:rgba(20,16,28,.45);}
  .dialog-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
  .dialog-head h3{font-size:1.1rem;font-weight:600;}
  .dialog-body{padding:18px 22px;display:flex;flex-direction:column;gap:14px;max-height:60vh;overflow-y:auto;}
  .dialog-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:.78rem;font-weight:600;color:var(--ink-muted);}
  .field input,.field select,.field textarea{
    padding:9px 11px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg);color:var(--ink);font-family:inherit;font-size:.9rem;
  }
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:480px){.field-row{grid-template-columns:1fr;}}
  .checkbox-field{display:flex;align-items:flex-start;gap:9px;font-size:.86rem;}
  .checkbox-field input{margin-top:3px;}
  .close-x{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--ink-muted);line-height:1;padding:2px 4px;}
  .close-x:hover{color:var(--ink);}

  /* ---------- Ficha ---------- */
  .ficha-back{margin-bottom:14px;}
  .ficha-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px 28px;box-shadow:0 1px 2px var(--shadow);}
  .ficha-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .ficha-title-row h2{font-size:1.35rem;font-weight:600;}
  .ficha-title-row .sub{color:var(--ink-muted);font-size:.85rem;margin-top:2px;}
  .id-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 22px;padding:16px 18px;background:var(--surface-2);border-radius:10px;margin-bottom:20px;}
  @media (max-width:640px){.id-grid{grid-template-columns:repeat(2,1fr);}}
  .id-item .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);margin-bottom:2px;}
  .id-item .v{font-weight:600;font-variant-numeric:tabular-nums;}

  .legal-block{
    border:1px solid var(--border);border-left:3px solid var(--accent);
    background:var(--surface-2);border-radius:0 8px 8px 0;
    padding:14px 18px;font-size:.83rem;color:var(--ink-muted);line-height:1.6;margin-bottom:22px;
  }
  .legal-block strong{color:var(--ink);}

  h3.section-title{font-size:1rem;font-weight:600;margin-bottom:12px;margin-top:26px;}
  .entrega-form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px;padding:16px;background:var(--surface-2);border-radius:10px;}
  .entrega-form .field{min-width:150px;flex:1 1 150px;}
  .entrega-form .field.qtd{max-width:100px;flex:0 0 100px;}
  .entrega-form .btn{flex:none;}

  .declaracao-box{margin-top:24px;padding:18px 20px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);}
  .declaracao-box .checkbox-field{margin-bottom:10px;}
  .declaracao-status{margin-top:10px;font-size:.82rem;color:var(--ink-muted);}

  /* ---------- Auth ---------- */
  .header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .user-badge{display:flex;align-items:center;gap:9px;font-size:.82rem;color:var(--ink-muted);}
  .user-badge .avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;flex:none;}
  .auth-wrap{min-height:60vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;}
  .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:30px 28px;width:100%;max-width:380px;box-shadow:0 4px 24px var(--shadow);}
  .auth-card h2{font-size:1.2rem;text-align:center;font-weight:600;}
  .auth-card .sub{color:var(--ink-muted);font-size:.85rem;text-align:center;margin:6px 0 20px;}
  .auth-card form{display:flex;flex-direction:column;gap:14px;}
  .auth-error{color:var(--critical);font-size:.83rem;background:var(--critical-soft);padding:9px 12px;border-radius:8px;margin-bottom:14px;}
  .auth-hint{font-size:.78rem;color:var(--ink-muted);margin-top:16px;text-align:center;}

  @media print{
    .no-print{display:none !important;}
    body{background:#fff;}
    .shell{max-width:none;padding:0;}
    .ficha-card{border:none;box-shadow:none;padding:0;}
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="shell">
  <header class="top no-print">
    <div class="brand">
      <img id="brand-logo" alt="ValexFruit" src="">
      <div class="titles">
        <div class="app-name">Controle de EPI</div>
        <div class="app-sub">Cooperativa Agrícola Vale do São Francisco</div>
      </div>
    </div>
    <div class="header-right no-print">
      <div id="sync-pill" class="sync-pill"><span class="sync-dot"></span><span id="sync-text">Conectando…</span></div>
      <div id="user-area"></div>
    </div>
  </header>

  <nav class="tabs no-print" id="tabs"></nav>

  <main id="app"></main>
</div>

<!-- Dialog: Funcionário -->
<dialog id="dlg-func">
  <form id="form-func" method="dialog">
    <div class="dialog-head">
      <h3 id="dlg-func-title">Novo funcionário</h3>
      <button type="button" class="close-x" data-action="close-dialog" data-dlg="dlg-func">&times;</button>
    </div>
    <div class="dialog-body">
      <div class="field"><label for="f-nome">Nome completo</label><input id="f-nome" name="nome" required placeholder="Ex.: Abimael Manoel da Silva"></div>
      <div class="field-row">
        <div class="field"><label for="f-cpf">CPF</label><input id="f-cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric"></div>
        <div class="field"><label for="f-matricula">Nº matrícula</label><input id="f-matricula" name="matricula" placeholder="Ex.: 376"></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="f-cargo">Cargo</label><input id="f-cargo" name="cargo" required placeholder="Ex.: Conferente"></div>
        <div class="field"><label for="f-setor">Setor</label><input id="f-setor" name="setor" required placeholder="Ex.: Logística"></div>
      </div>
      <div class="field"><label for="f-admissao">Data de admissão</label><input id="f-admissao" name="dataAdmissao" type="date"></div>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn btn-secondary" data-action="close-dialog" data-dlg="dlg-func">Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</dialog>

<!-- Dialog: Tipo de EPI -->
<dialog id="dlg-epi">
  <form id="form-epi" method="dialog">
    <div class="dialog-head">
      <h3 id="dlg-epi-title">Novo tipo de EPI</h3>
      <button type="button" class="close-x" data-action="close-dialog" data-dlg="dlg-epi">&times;</button>
    </div>
    <div class="dialog-body">
      <div class="field"><label for="e-nome">Descrição do equipamento</label><input id="e-nome" name="nome" required placeholder="Ex.: Luvas de raspa"></div>
      <div class="field-row">
        <div class="field"><label for="e-ca">Nº do C.A.</label><input id="e-ca" name="ca" placeholder="Ex.: 34497"></div>
        <div class="field"><label for="e-unidade">Unidade</label><input id="e-unidade" name="unidade" list="unidades-list" placeholder="Ex.: par" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="e-estoque">Estoque atual</label><input id="e-estoque" name="estoqueAtual" type="number" min="0" step="1" value="0" required></div>
        <div class="field"><label for="e-minimo">Estoque mínimo</label><input id="e-minimo" name="estoqueMinimo" type="number" min="0" step="1" value="5" required></div>
      </div>
      <div class="field"><label for="e-validade">Prazo de troca recomendado (dias)</label><input id="e-validade" name="validadeDias" type="number" min="0" step="1" placeholder="Ex.: 180 — deixe em branco se não houver prazo"></div>
      <datalist id="unidades-list">
        <option value="par"><option value="unidade"><option value="conjunto">
      </datalist>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn btn-secondary" data-action="close-dialog" data-dlg="dlg-epi">Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</dialog>

<!-- Dialog: Movimentação de estoque -->
<dialog id="dlg-mov">
  <form id="form-mov" method="dialog">
    <div class="dialog-head">
      <h3>Registrar movimentação de estoque</h3>
      <button type="button" class="close-x" data-action="close-dialog" data-dlg="dlg-mov">&times;</button>
    </div>
    <div class="dialog-body">
      <div class="field"><label for="m-tipo-epi">Tipo de EPI</label><select id="m-tipo-epi" name="tipoEpiId" required></select></div>
      <div class="field-row">
        <div class="field"><label for="m-tipo-mov">Movimento</label>
          <select id="m-tipo-mov" name="tipo" required>
            <option value="entrada">Entrada (compra)</option>
            <option value="saida">Saída (ajuste/perda)</option>
          </select>
        </div>
        <div class="field"><label for="m-quantidade">Quantidade</label><input id="m-quantidade" name="quantidade" type="number" min="1" step="1" value="1" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="m-data">Data</label><input id="m-data" name="data" type="date" required></div>
        <div class="field"><label for="m-motivo">Motivo</label><input id="m-motivo" name="motivo" placeholder="Ex.: Compra mensal"></div>
      </div>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn btn-secondary" data-action="close-dialog" data-dlg="dlg-mov">Cancelar</button>
      <button type="submit" class="btn btn-primary">Registrar</button>
    </div>
  </form>
</dialog>

<!-- Dialog: Novo usuário -->
<dialog id="dlg-usuario">
  <form id="form-usuario" method="dialog">
    <div class="dialog-head">
      <h3>Novo usuário</h3>
      <button type="button" class="close-x" data-action="close-dialog" data-dlg="dlg-usuario">&times;</button>
    </div>
    <div class="dialog-body">
      <div class="field"><label for="u-nome">Nome</label><input id="u-nome" required placeholder="Ex.: João da Silva"></div>
      <div class="field"><label for="u-email">E-mail</label><input id="u-email" type="email" required autocomplete="off" placeholder="ex.: joao.silva@valexfruit.com.br"></div>
      <div class="field-row">
        <div class="field"><label for="u-senha">Senha</label><input id="u-senha" type="password" required minlength="6"></div>
        <div class="field"><label for="u-senha2">Confirmar senha</label><input id="u-senha2" type="password" required minlength="6"></div>
      </div>
      <div class="field"><label for="u-papel">Papel</label>
        <select id="u-papel">
          <option value="operador">Operador</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn btn-secondary" data-action="close-dialog" data-dlg="dlg-usuario">Cancelar</button>
      <button type="submit" class="btn btn-primary">Criar usuário</button>
    </div>
  </form>
</dialog>

<!-- Dialog: Avaliação de conservação -->
<dialog id="dlg-avaliacao">
  <form id="form-avaliacao" method="dialog">
    <div class="dialog-head">
      <h3>Avaliação de conservação do EPI</h3>
      <button type="button" class="close-x" data-action="close-dialog" data-dlg="dlg-avaliacao">&times;</button>
    </div>
    <div class="dialog-body">
      <div class="field"><label for="av-estado">Estado de conservação</label>
        <select id="av-estado">
          <option value="bom">Bom</option>
          <option value="regular">Regular</option>
          <option value="ruim">Ruim — precisa troca</option>
        </select>
      </div>
      <div class="field"><label for="av-data">Data da avaliação</label><input id="av-data" type="date" required></div>
      <div class="field"><label for="av-observacao">Observação</label><textarea id="av-observacao" rows="3" placeholder="Ex.: desgaste na sola, costura rompida…"></textarea></div>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn btn-secondary" data-action="close-dialog" data-dlg="dlg-avaliacao">Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar avaliação</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  'use strict';

  /* ================= Utilities ================= */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function uid(){ return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,9); }
  function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fmtDateBR(iso){ if(!iso) return '—'; var p=iso.split('-'); if(p.length!==3) return iso; return p[2]+'/'+p[1]+'/'+p[0]; }
  function byId(arr,id){ return arr.find(function(x){return x.id===id;}); }

  /* ================= State ================= */
  var state = {
    tab: 'painel',
    funcionarios: [],
    tiposEpi: [],
    entregas: [],
    movimentacoes: [],
    usuarios: [],
    avaliacoes: [],
    fichaId: null,
    filters: { funcionarios:'', catalogo:'', estoque:'', relatorio:'', relatorioStatus:'todos' },
    currentUser: null,
    authView: 'loading',
    authError: '',
  };
  var firebaseConfig = {
    apiKey: "AIzaSyDzq4rgSJktM8G33UsK6AZonSSKfUadGk4",
    authDomain: "controle-de-epi--valexfruit.firebaseapp.com",
    projectId: "controle-de-epi--valexfruit",
    storageBucket: "controle-de-epi--valexfruit.firebasestorage.app",
    messagingSenderId: "398571205222",
    appId: "1:398571205222:web:96f668e1c9bd60aab073a7",
    measurementId: "G-XQRE18G0QS"
  };
  var draft = {
    entrega: { tipoEpiId:'', quantidade:1, data: todayISO() },
  };
  var editing = { func:null, epi:null };
  var db = null;
  var auth = null;
  var secondaryAuth = null;
  var suppressAuthListener = false;

  /* ================= Firebase init ================= */
  function withTimeout(promise, ms){
    return Promise.race([
      promise,
      new Promise(function(_, reject){ setTimeout(function(){ reject(new Error('timeout')); }, ms); })
    ]);
  }
  async function initFirebase(){
    firebase.initializeApp(firebaseConfig);
    var secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary');
    auth = firebase.auth();
    secondaryAuth = secondaryApp.auth();
    db = firebase.firestore();
    try{ db.settings({ experimentalAutoDetectLongPolling: true, useFetchStreams: false }); }catch(e){}
    updateSyncPill();
    subscribeAll();
    seedCatalogIfEmpty();
    setTimeout(function(){
      if(state.authView==='loading'){ state.authView = 'login'; render(); }
    }, 18000);
    auth.onAuthStateChanged(async function(user){
      try{
        if(suppressAuthListener) return;
        if(!user){
          state.currentUser = null;
          try{
            var metaDoc = await withTimeout(db.doc('meta/config').get(), 15000);
            state.authView = (metaDoc.exists && metaDoc.data().hasUsers) ? 'login' : 'setup';
          }catch(e){ console.error('meta/config read failed:', e); state.authView = 'login'; }
          render();
          return;
        }
        try{
          var doc = await withTimeout(db.doc('usuarios/'+user.uid).get(), 15000);
          if(!doc.exists || doc.data().ativo===false){
            await auth.signOut();
            state.authError = 'Este usuário está desativado. Fale com um administrador.';
            state.authView = 'login';
            render();
            return;
          }
          var d = doc.data();
          state.currentUser = {uid:user.uid, email:user.email, nome:d.nome, papel:d.papel};
          state.authError = '';
          state.authView = null;
          render();
        }catch(e){
          console.error('usuarios/{uid} read failed:', e);
          try{ await auth.signOut(); }catch(e2){}
          state.authError = 'Não foi possível confirmar seu acesso. Tente novamente.';
          state.authView = 'login';
          render();
        }
      }catch(outerErr){
        console.error('onAuthStateChanged outer error:', outerErr);
        state.authView = 'login';
        render();
      }
    });
  }

  async function attemptLogin(email, senha){
    if(!email || !senha){ state.authError = 'Informe e-mail e senha.'; render(); return; }
    state.authView = 'loading'; render();
    try{
      await auth.signInWithEmailAndPassword(email, senha);
    }catch(e){
      state.authError = 'E-mail ou senha inválidos.';
      state.authView = 'login';
      render();
    }
  }

  async function attemptSetup(nome, email, senha, senha2){
    if(!nome || !email || !senha){ state.authError = 'Preencha todos os campos.'; render(); return; }
    if(senha.length<6){ state.authError = 'A senha deve ter pelo menos 6 caracteres.'; render(); return; }
    if(senha!==senha2){ state.authError = 'As senhas não coincidem.'; render(); return; }
    state.authView = 'loading'; render();
    suppressAuthListener = true;
    try{
      var cred = await auth.createUserWithEmailAndPassword(email, senha);
      await db.doc('usuarios/'+cred.user.uid).set({nome:nome, email:email, papel:'admin', ativo:true, criadoEm:todayISO()});
      await db.doc('meta/config').set({hasUsers:true});
      state.currentUser = {uid:cred.user.uid, email:email, nome:nome, papel:'admin'};
      state.authError = '';
      state.authView = null;
      render();
    }catch(e){
      state.authError = (e && e.code==='auth/email-already-in-use') ? 'Já existe uma conta com esse e-mail.' : 'Não foi possível criar a conta. Verifique os dados e tente novamente.';
      state.authView = 'setup';
      render();
    }finally{
      suppressAuthListener = false;
    }
  }

  function logout(){
    auth.signOut();
    state.tab = 'painel';
    state.fichaId = null;
  }

  async function createUsuarioAdmin(p){
    try{
      var cred = await secondaryAuth.createUserWithEmailAndPassword(p.email, p.senha);
      await db.doc('usuarios/'+cred.user.uid).set({nome:p.nome, email:p.email, papel:p.papel, ativo:true, criadoEm:todayISO()});
      await secondaryAuth.signOut();
      return true;
    }catch(e){
      alert(e && e.code==='auth/email-already-in-use' ? 'Já existe uma conta com esse e-mail.' : 'Não foi possível criar o usuário. Verifique os dados e tente novamente.');
      return false;
    }
  }
  async function toggleUsuarioAtivo(uidAlvo){
    var u = state.usuarios.find(function(x){ return x.uid===uidAlvo; });
    if(!u) return;
    var novo = u.ativo===false;
    await db.doc('usuarios/'+uidAlvo).update({ativo:novo});
  }
  async function resetSenhaUsuario(email){
    try{
      await auth.sendPasswordResetEmail(email);
      alert('Enviamos um link de redefinição de senha para '+email+'.');
    }catch(e){
      alert('Não foi possível enviar o e-mail de redefinição agora. Tente novamente em instantes.');
    }
  }

  function baixarBackup(){
    var payload = {
      geradoEm: new Date().toISOString(),
      funcionarios: state.funcionarios,
      tiposEpi: state.tiposEpi,
      entregas: state.entregas,
      movimentacoes: state.movimentacoes,
      avaliacoes: state.avaliacoes
    };
    var json = JSON.stringify(payload, null, 2);
    try{
      var blob = new Blob([json], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'backup-epi-valexfruit-'+todayISO()+'.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }catch(e){
      alert('Não foi possível gerar o backup agora. Tente novamente em instantes.');
    }
  }

  function subscribeAll(){
    db.collection('funcionarios').onSnapshot(function(snap){
      state.funcionarios = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(){});
    db.collection('tiposEpi').onSnapshot(function(snap){
      state.tiposEpi = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(){});
    db.collection('entregas').onSnapshot(function(snap){
      state.entregas = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(){});
    db.collection('movimentacoes').onSnapshot(function(snap){
      state.movimentacoes = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(){});
    db.collection('usuarios').onSnapshot(function(snap){
      state.usuarios = snap.docs.map(function(d){ return Object.assign({uid:d.id}, d.data()); });
      render();
    }, function(){});
    db.collection('avaliacoes').onSnapshot(function(snap){
      state.avaliacoes = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(){});
  }

  var seedAttempted = false;
  async function seedCatalogIfEmpty(){
    if(seedAttempted) return;
    seedAttempted = true;
    try{
      var snap = await db.collection('tiposEpi').limit(1).get();
      if(snap.empty){
        var defaults = [
          {nome:'Luvas de raspa (colheita)', ca:'34497', unidade:'par', estoqueAtual:40, estoqueMinimo:10, validadeDias:90},
          {nome:'Bota de PVC cano longo', ca:'48383', unidade:'par', estoqueAtual:25, estoqueMinimo:8, validadeDias:365},
          {nome:'Óculos de proteção', ca:'25400', unidade:'unidade', estoqueAtual:15, estoqueMinimo:10, validadeDias:365},
          {nome:'Protetor auricular tipo plug', ca:'19578', unidade:'par', estoqueAtual:50, estoqueMinimo:15, validadeDias:60},
          {nome:'Máscara respiratória PFF2', ca:'40234', unidade:'unidade', estoqueAtual:18, estoqueMinimo:20, validadeDias:30},
          {nome:'Balaclava', ca:'48249', unidade:'unidade', estoqueAtual:22, estoqueMinimo:8, validadeDias:180},
          {nome:'Capacete de segurança', ca:'31469', unidade:'unidade', estoqueAtual:12, estoqueMinimo:5, validadeDias:730},
          {nome:'Avental de raspa', ca:'28711', unidade:'unidade', estoqueAtual:9, estoqueMinimo:6, validadeDias:180},
        ];
        for(var i=0;i<defaults.length;i++){ await db.collection('tiposEpi').add(defaults[i]); }
      }
    }catch(e){ /* ignore seeding failure, page still works */ }
  }

  function updateSyncPill(){
    var pill = document.getElementById('sync-pill');
    var text = document.getElementById('sync-text');
    pill.classList.remove('local');
    text.textContent = 'Sincronizado — dados salvos para toda a equipe';
  }

  /* ================= CRUD ================= */
  async function createFuncionario(data){
    await db.collection('funcionarios').add(data);
  }
  async function updateFuncionario(id, data){
    await db.doc('funcionarios/'+id).update(data);
  }
  async function createTipoEpi(data){
    await db.collection('tiposEpi').add(data);
  }
  async function updateTipoEpi(id, data){
    await db.doc('tiposEpi/'+id).update(data);
  }

  function registradoPor(){ return state.currentUser ? (state.currentUser.nome||state.currentUser.email) : ''; }

  async function registrarMovimentacao(m){
    var tipo = byId(state.tiposEpi, m.tipoEpiId);
    if(!tipo) return;
    var delta = m.tipo==='entrada' ? m.quantidade : -m.quantidade;
    var novaQtd = Math.max(0, (tipo.estoqueAtual||0) + delta);
    var movDoc = {tipoEpiId:tipo.id, tipoEpiNome:tipo.nome, tipo:m.tipo, quantidade:m.quantidade, data:m.data, motivo:m.motivo||'', registradoPor:registradoPor()};
    await db.doc('tiposEpi/'+tipo.id).update({estoqueAtual:novaQtd});
    await db.collection('movimentacoes').add(movDoc);
  }

  async function registrarEntrega(p){
    var tipo = byId(state.tiposEpi, p.tipoEpiId);
    var func = byId(state.funcionarios, p.funcionarioId);
    if(!tipo || !func) return;
    var novaQtd = Math.max(0, (tipo.estoqueAtual||0) - p.quantidade);
    var entregaDoc = {
      funcionarioId:func.id, funcionarioNome:func.nome,
      tipoEpiId:tipo.id, tipoEpiNome:tipo.nome, ca:tipo.ca||'', unidade:tipo.unidade||'',
      quantidade:p.quantidade, dataRetirada:p.data, dataDevolucao:null, confirmado:false, registradoPor:registradoPor()
    };
    var movDoc = {tipoEpiId:tipo.id, tipoEpiNome:tipo.nome, tipo:'saida', quantidade:p.quantidade, data:p.data, motivo:'Entrega para '+func.nome, registradoPor:registradoPor()};
    await db.collection('entregas').add(entregaDoc);
    await db.doc('tiposEpi/'+tipo.id).update({estoqueAtual:novaQtd});
    await db.collection('movimentacoes').add(movDoc);
  }

  async function toggleConfirmado(entregaId){
    var e = byId(state.entregas, entregaId);
    if(!e) return;
    var novo = !e.confirmado;
    await db.doc('entregas/'+entregaId).update({confirmado:novo});
  }

  async function registrarDevolucao(entregaId){
    var e = byId(state.entregas, entregaId);
    if(!e) return;
    var repor = confirm('Repor '+e.quantidade+' '+(e.unidade||'unidade(s)')+' de "'+e.tipoEpiNome+'" ao estoque?\n\nOK = repor ao estoque · Cancelar = apenas registrar a devolução');
    var dataDev = todayISO();
    await db.doc('entregas/'+entregaId).update({dataDevolucao:dataDev});
    if(repor){
      var tipo = byId(state.tiposEpi, e.tipoEpiId);
      if(tipo){
        var novaQtd = (tipo.estoqueAtual||0) + e.quantidade;
        var movDoc = {tipoEpiId:tipo.id, tipoEpiNome:tipo.nome, tipo:'entrada', quantidade:e.quantidade, data:dataDev, motivo:'Devolução de '+e.funcionarioNome, registradoPor:registradoPor()};
        await db.doc('tiposEpi/'+tipo.id).update({estoqueAtual:novaQtd});
        await db.collection('movimentacoes').add(movDoc);
      }
    }
  }

  async function registrarAvaliacao(entregaId, p){
    var e = byId(state.entregas, entregaId);
    if(!e) return;
    var avDoc = {
      entregaId:entregaId, funcionarioId:e.funcionarioId, funcionarioNome:e.funcionarioNome,
      tipoEpiNome:e.tipoEpiNome, data:p.data, estado:p.estado, observacao:p.observacao||'',
      avaliadoPor: registradoPor()
    };
    await db.collection('avaliacoes').add(avDoc);
  }

  async function registrarDesligamento(funcionarioId){
    if(!confirm('Confirmar desligamento deste funcionário na data de hoje?')) return;
    await updateFuncionario(funcionarioId, {dataDemissao: todayISO()});
  }
  async function reativarFuncionario(funcionarioId){
    await updateFuncionario(funcionarioId, {dataDemissao: null});
  }
  async function salvarDeclaracao(funcionarioId, uso, treinamento, data){
    await updateFuncionario(funcionarioId, {declaracaoUso:uso, declaracaoTreinamento:treinamento, dataDeclaracao:data});
  }

  /* ================= Derived helpers ================= */
  function estoqueStatus(t){
    var atual = t.estoqueAtual||0, min = t.estoqueMinimo||0;
    if(atual<=0) return {cls:'chip-critical', label:'Esgotado'};
    if(atual<=min) return {cls:'chip-warn', label:'Baixo'};
    return {cls:'chip-good', label:'OK'};
  }
  function funcionarioAtivo(f){ return !f.dataDemissao; }
  function declaracaoCompleta(f){ return !!(f.declaracaoUso && f.declaracaoTreinamento); }
  function entregasDoFuncionario(fid){
    return state.entregas.filter(function(e){return e.funcionarioId===fid;})
      .slice().sort(function(a,b){ return (b.dataRetirada||'').localeCompare(a.dataRetirada||''); });
  }
  function addDaysISO(iso, days){
    var d = new Date(iso+'T00:00:00');
    d.setDate(d.getDate() + (days||0));
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function daysBetweenISO(aISO,bISO){
    var a = new Date(aISO+'T00:00:00'), b = new Date(bISO+'T00:00:00');
    return Math.round((b-a)/86400000);
  }
  function calcPrazoStatus(e, tipo){
    if(e.dataDevolucao) return {key:'devolvido', cls:'chip-neutral', label:'Devolvido em '+fmtDateBR(e.dataDevolucao)};
    var dias = tipo && tipo.validadeDias;
    if(!dias) return {key:'sem-prazo', cls:'chip-neutral', label:'Sem prazo definido'};
    var prevista = addDaysISO(e.dataRetirada, dias);
    var diff = daysBetweenISO(todayISO(), prevista);
    if(diff<0) return {key:'vencido', cls:'chip-critical', label:'Vencido há '+Math.abs(diff)+' dia(s)', prevista:prevista};
    if(diff<=15) return {key:'atencao', cls:'chip-warn', label:'Vence em '+diff+' dia(s)', prevista:prevista};
    return {key:'em-dia', cls:'chip-good', label:'Em dia', prevista:prevista};
  }
  function avaliacoesDaEntrega(entregaId){
    return state.avaliacoes.filter(function(a){ return a.entregaId===entregaId; })
      .slice().sort(function(a,b){ return (b.data||'').localeCompare(a.data||''); });
  }
  function ultimaAvaliacao(entregaId){
    var list = avaliacoesDaEntrega(entregaId);
    return list.length ? list[0] : null;
  }
  function avaliacaoChip(av){
    if(!av) return {cls:'chip-neutral', label:'Nunca avaliado'};
    var labels = {bom:'Bom', regular:'Regular', ruim:'Ruim — precisa troca'};
    var classes = {bom:'chip-good', regular:'chip-warn', ruim:'chip-critical'};
    return {cls: classes[av.estado]||'chip-neutral', label:(labels[av.estado]||av.estado)+' · '+fmtDateBR(av.data)};
  }
  function buildLinhasRelatorio(){
    return state.entregas.map(function(e){
      var tipo = byId(state.tiposEpi, e.tipoEpiId);
      var func = byId(state.funcionarios, e.funcionarioId);
      return {e:e, tipo:tipo, func:func, prazo:calcPrazoStatus(e, tipo), ultima:ultimaAvaliacao(e.id)};
    }).filter(function(l){ return !!l.func; });
  }

  /* ================= Focus-preserving render ================= */
  function withFocusPreserved(fn){
    var active = document.activeElement;
    var id = active && active.id;
    var selStart=null, selEnd=null;
    if(active && 'selectionStart' in active){ try{ selStart=active.selectionStart; selEnd=active.selectionEnd; }catch(e){} }
    fn();
    if(id){
      var el = document.getElementById(id);
      if(el){
        el.focus();
        if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
      }
    }
  }

  function render(){ withFocusPreserved(renderNow); }

  function renderChrome(){
    var tabsNav = document.getElementById('tabs');
    var userArea = document.getElementById('user-area');
    if(!state.currentUser){ tabsNav.style.display='none'; tabsNav.innerHTML=''; userArea.innerHTML=''; return; }
    tabsNav.style.display='';
    var tabs = [
      {id:'painel', label:'Painel'},
      {id:'funcionarios', label:'Funcionários'},
      {id:'catalogo', label:'Catálogo de EPI'},
      {id:'estoque', label:'Estoque'},
      {id:'relatorio', label:'Relatório de EPI'},
    ];
    if(state.currentUser.papel==='admin') tabs.push({id:'usuarios', label:'Usuários'});
    tabsNav.innerHTML = tabs.map(function(t){
      var active = state.tab===t.id && !state.fichaId;
      return '<button data-action="set-tab" data-tab="'+t.id+'" class="'+(active?'active':'')+'">'+esc(t.label)+'</button>';
    }).join('');
    var initials = (state.currentUser.nome||state.currentUser.email||'?').trim().slice(0,1).toUpperCase();
    userArea.innerHTML = '<div class="user-badge"><span class="avatar">'+esc(initials)+'</span><span>'+esc(state.currentUser.nome||state.currentUser.email)+' · '+(state.currentUser.papel==='admin'?'Admin':'Operador')+'</span><button class="btn btn-ghost" data-action="logout">Sair</button></div>';
  }

  function renderNow(){
    renderChrome();
    var app = document.getElementById('app');
    if(state.authView==='loading'){ app.innerHTML = renderAuthLoading(); return; }
    if(state.authView==='setup'){ app.innerHTML = renderAuthSetup(); return; }
    if(state.authView==='login'){ app.innerHTML = renderAuthLogin(); return; }
    if(state.fichaId){ app.innerHTML = renderFicha(state.fichaId); return; }
    if(state.tab==='painel') app.innerHTML = renderPainel();
    else if(state.tab==='funcionarios') app.innerHTML = renderFuncionarios();
    else if(state.tab==='catalogo') app.innerHTML = renderCatalogo();
    else if(state.tab==='estoque') app.innerHTML = renderEstoque();
    else if(state.tab==='relatorio') app.innerHTML = renderRelatorio();
    else if(state.tab==='usuarios') app.innerHTML = (state.currentUser.papel==='admin') ? renderUsuarios() : renderPainel();
  }

  /* ================= Autenticação (telas) ================= */
  function renderAuthLoading(){
    return '<div class="auth-wrap"><div class="auth-card"><h2>Carregando…</h2></div></div>';
  }
  function renderAuthSetup(){
    var err = state.authError ? '<div class="auth-error">'+esc(state.authError)+'</div>' : '';
    return ''+
      '<div class="auth-wrap"><div class="auth-card">'+
        '<h2>Configuração inicial</h2><div class="sub">Crie a primeira conta de administrador para começar a usar o Controle de EPI.</div>'+
        err+
        '<form id="form-setup">'+
          '<div class="field"><label for="s-nome">Seu nome</label><input id="s-nome" required></div>'+
          '<div class="field"><label for="s-email">E-mail</label><input id="s-email" type="email" required autocomplete="off" placeholder="ex.: marta@valexfruit.com.br"></div>'+
          '<div class="field"><label for="s-senha">Senha</label><input id="s-senha" type="password" required minlength="6"></div>'+
          '<div class="field"><label for="s-senha2">Confirmar senha</label><input id="s-senha2" type="password" required minlength="6"></div>'+
          '<button type="submit" class="btn btn-primary" style="justify-content:center;">Criar conta e entrar</button>'+
        '</form>'+
      '</div></div>';
  }
  function renderAuthLogin(){
    var err = state.authError ? '<div class="auth-error">'+esc(state.authError)+'</div>' : '';
    return ''+
      '<div class="auth-wrap"><div class="auth-card">'+
        '<h2>Entrar</h2><div class="sub">Controle de EPI · ValexFruit</div>'+
        err+
        '<form id="form-login">'+
          '<div class="field"><label for="l-email">E-mail</label><input id="l-email" type="email" required autocomplete="username"></div>'+
          '<div class="field"><label for="l-senha">Senha</label><input id="l-senha" type="password" required autocomplete="current-password"></div>'+

  /* ================= Painel ================= */
  function renderPainel(){
    var ativos = state.funcionarios.filter(funcionarioAtivo);
    var baixos = state.tiposEpi.filter(function(t){ return (t.estoqueAtual||0) <= (t.estoqueMinimo||0); })
      .sort(function(a,b){ return (a.estoqueAtual||0)-(b.estoqueAtual||0); });
    var pendentes = ativos.filter(function(f){ return !declaracaoCompleta(f); })
      .sort(function(a,b){ return (b.dataAdmissao||'').localeCompare(a.dataAdmissao||''); });
    var linhas = buildLinhasRelatorio();
    var vencidos = linhas.filter(function(l){ return l.prazo.key==='vencido'; })
      .sort(function(a,b){ return (a.prazo.prevista||'').localeCompare(b.prazo.prevista||''); });
    var aVencer = linhas.filter(function(l){ return l.prazo.key==='atencao'; })
      .sort(function(a,b){ return (a.prazo.prevista||'').localeCompare(b.prazo.prevista||''); });

    var kpiHtml =
      '<div class="kpi"><div class="num">'+ativos.length+'</div><div class="label">Funcionários ativos</div></div>'+
      '<div class="kpi"><div class="num">'+state.tiposEpi.length+'</div><div class="label">Tipos de EPI cadastrados</div></div>'+
      '<div class="kpi'+(baixos.length?' tone-warn':'')+'"><div class="num">'+baixos.length+'</div><div class="label">Itens com estoque baixo</div></div>'+
      '<div class="kpi'+(vencidos.length?' tone-critical':'')+'"><div class="num">'+vencidos.length+'</div><div class="label">Prazos de troca vencidos</div></div>'+
      '<div class="kpi'+(pendentes.length?' tone-critical':'')+'"><div class="num">'+pendentes.length+'</div><div class="label">Declarações pendentes</div></div>';

    var baixosHtml = baixos.length ? baixos.slice(0,8).map(function(t){
      var st = estoqueStatus(t);
      return '<div class="alert-row"><div><strong>'+esc(t.nome)+'</strong><div class="meta">'+(t.estoqueAtual||0)+' de mínimo '+(t.estoqueMinimo||0)+' '+esc(t.unidade||'')+'</div></div><span class="chip '+st.cls+'">'+st.label+'</span></div>';
    }).join('') : '<div class="empty-msg">Nenhum item com estoque baixo. 🎉</div>';

    var pendentesHtml = pendentes.length ? pendentes.slice(0,8).map(function(f){
      return '<div class="alert-row"><div><strong>'+esc(f.nome)+'</strong><div class="meta">'+esc(f.cargo||'')+' · '+esc(f.setor||'')+'</div></div><button class="btn btn-ghost" data-action="open-ficha" data-id="'+f.id+'">Ver ficha</button></div>';
    }).join('') : '<div class="empty-msg">Todas as declarações estão em dia.</div>';

    var prazosHtml = (vencidos.length||aVencer.length) ? vencidos.concat(aVencer).slice(0,8).map(function(l){
      return '<div class="alert-row"><div><strong>'+esc(l.func.nome)+'</strong><div class="meta">'+esc(l.e.tipoEpiNome)+' · retirado em '+fmtDateBR(l.e.dataRetirada)+'</div></div><span class="chip '+l.prazo.cls+'">'+esc(l.prazo.label)+'</span></div>';
    }).join('') : '<div class="empty-msg">Nenhum prazo de troca vencido ou próximo. 🎉</div>';

    return ''+
      '<div class="kpi-grid">'+kpiHtml+'</div>'+
      '<div class="panels-grid">'+
        '<div class="panel"><h3>Estoque baixo</h3>'+baixosHtml+'</div>'+
        '<div class="panel"><h3>Prazos de troca vencidos ou próximos</h3>'+prazosHtml+'</div>'+

  /* ================= Relatório de EPI por colaborador ================= */
  function renderRelatorio(){
    var linhas = buildLinhasRelatorio();
    var q = state.filters.relatorio.trim().toLowerCase();
    var statusFiltro = state.filters.relatorioStatus || 'todos';
    linhas = linhas.filter(function(l){
      if(statusFiltro!=='todos' && l.prazo.key!==statusFiltro) return false;
      if(!q) return true;
      var alvo = ((l.func&&l.func.nome)||'')+' '+((l.func&&l.func.setor)||'')+' '+(l.e.tipoEpiNome||'');
      return alvo.toLowerCase().indexOf(q)>=0;
    });
    var peso = {vencido:0, atencao:1, 'em-dia':2, 'sem-prazo':3, devolvido:4};
    linhas.sort(function(a,b){
      var pa = peso[a.prazo.key], pb = peso[b.prazo.key];
      if(pa!==pb) return pa-pb;
      return (a.prazo.prevista||a.e.dataRetirada||'').localeCompare(b.prazo.prevista||b.e.dataRetirada||'');
    });

    var todas = buildLinhasRelatorio();
    var nVencidos = todas.filter(function(l){return l.prazo.key==='vencido';}).length;
    var nAtencao = todas.filter(function(l){return l.prazo.key==='atencao';}).length;
    var nEmDia = todas.filter(function(l){return l.prazo.key==='em-dia';}).length;
    var nNuncaAvaliados = todas.filter(function(l){return !l.e.dataDevolucao && !l.ultima;}).length;

    var rows = linhas.length ? linhas.map(function(l){
      var av = avaliacaoChip(l.ultima);
      return '<tr>'+
        '<td><strong>'+esc(l.func.nome)+'</strong></td>'+
        '<td>'+esc(l.func.setor||'—')+'</td>'+
        '<td>'+esc(l.e.tipoEpiNome)+'</td>'+
        '<td>'+esc(l.e.ca||'—')+'</td>'+
        '<td>'+fmtDateBR(l.e.dataRetirada)+'</td>'+
        '<td>'+(l.prazo.prevista? fmtDateBR(l.prazo.prevista) : '—')+'</td>'+
        '<td><span class="chip '+l.prazo.cls+'">'+esc(l.prazo.label)+'</span></td>'+
        '<td><span class="chip '+av.cls+'">'+esc(av.label)+'</span></td>'+
        '<td><button class="btn btn-ghost" data-action="open-ficha" data-id="'+l.func.id+'">Ver ficha</button></td>'+
      '</tr>';
    }).join('') : '<tr><td colspan="9"><div class="empty-msg">Nenhum registro encontrado para este filtro.</div></td></tr>';

    return ''+
      '<div class="kpi-grid">'+
        '<div class="kpi'+(nVencidos?' tone-critical':'')+'"><div class="num">'+nVencidos+'</div><div class="label">Prazos vencidos</div></div>'+
        '<div class="kpi'+(nAtencao?' tone-warn':'')+'"><div class="num">'+nAtencao+'</div><div class="label">Vencendo em até 15 dias</div></div>'+
        '<div class="kpi"><div class="num">'+nEmDia+'</div><div class="label">Em dia</div></div>'+
        '<div class="kpi'+(nNuncaAvaliados?' tone-warn':'')+'"><div class="num">'+nNuncaAvaliados+'</div><div class="label">Nunca avaliados</div></div>'+
      '</div>'+
      '<section class="tab-section">'+
        '<div class="section-head">'+
          '<h2>Relatório de EPI por colaborador</h2>'+
          '<div class="toolbar">'+
            '<input id="search-relatorio" class="search-input" type="search" placeholder="Buscar por funcionário, setor ou EPI…" value="'+esc(state.filters.relatorio)+'" data-filter="relatorio">'+
            '<select id="filter-relatorio-status" class="search-input" data-filter-select="relatorioStatus">'+
              '<option value="todos"'+(statusFiltro==='todos'?' selected':'')+'>Todos os status</option>'+
              '<option value="vencido"'+(statusFiltro==='vencido'?' selected':'')+'>Vencidos</option>'+
              '<option value="atencao"'+(statusFiltro==='atencao'?' selected':'')+'>Vencendo em breve</option>'+
              '<option value="em-dia"'+(statusFiltro==='em-dia'?' selected':'')+'>Em dia</option>'+
              '<option value="sem-prazo"'+(statusFiltro==='sem-prazo'?' selected':'')+'>Sem prazo definido</option>'+
              '<option value="devolvido"'+(statusFiltro==='devolvido'?' selected':'')+'>Devolvidos</option>'+
            '</select>'+
          '</div>'+
        '</div>'+
        '<div class="table-wrap"><table>'+
          '<thead><tr><th>Funcionário</th><th>Setor</th><th>EPI</th><th>Nº CA</th><th>Retirada</th><th>Previsão de troca</th><th>Situação do prazo</th><th>Avaliação de conservação</th><th></th></tr></thead>'+
          '<tbody>'+rows+'</tbody>'+
        '</table></div>'+
      '</section>';
  }

  /* ================= Dialog helpers ================= */
  function openDialog(id){ document.getElementById(id).showModal(); }
  function closeDialog(id){ document.getElementById(id).close(); }

  function openFuncNew(){
    editing.func = null;
    document.getElementById('dlg-func-title').textContent = 'Novo funcionário';
    var form = document.getElementById('form-func'); form.reset();
    document.getElementById('f-admissao').value = todayISO();
    openDialog('dlg-func');
  }
  function openFuncEdit(id){
    var f = byId(state.funcionarios, id);
    if(!f) return;
    editing.func = id;
    document.getElementById('dlg-func-title').textContent = 'Editar funcionário';
    document.getElementById('f-nome').value = f.nome||'';
    document.getElementById('f-cpf').value = f.cpf||'';
    document.getElementById('f-matricula').value = f.matricula||'';
    document.getElementById('f-admissao').value = f.dataAdmissao||'';
    document.getElementById('f-cargo').value = f.cargo||'';
    document.getElementById('f-setor').value = f.setor||'';
    openDialog('dlg-func');
  }
  function openEpiNew(){
    editing.epi = null;
    document.getElementById('dlg-epi-title').textContent = 'Novo tipo de EPI';
    document.getElementById('form-epi').reset();
    document.getElementById('e-estoque').value = 0;
    document.getElementById('e-minimo').value = 5;
    openDialog('dlg-epi');
  }
  function openEpiEdit(id){
    var t = byId(state.tiposEpi, id);
    if(!t) return;
    editing.epi = id;
    document.getElementById('dlg-epi-title').textContent = 'Editar tipo de EPI';
    document.getElementById('e-nome').value = t.nome||'';
    document.getElementById('e-ca').value = t.ca||'';
    document.getElementById('e-unidade').value = t.unidade||'';
    document.getElementById('e-estoque').value = t.estoqueAtual||0;
    document.getElementById('e-minimo').value = t.estoqueMinimo||0;
    document.getElementById('e-validade').value = t.validadeDias||'';
    openDialog('dlg-epi');
  }
  function openMov(){
    var sel = document.getElementById('m-tipo-epi');
    sel.innerHTML = state.tiposEpi.slice().sort(function(a,b){return (a.nome||'').localeCompare(b.nome||'');}).map(function(t){
      return '<option value="'+t.id+'">'+esc(t.nome)+' (estoque: '+(t.estoqueAtual||0)+')</option>';
    }).join('');
    document.getElementById('form-mov').reset();
    document.getElementById('m-data').value = todayISO();
    document.getElementById('m-quantidade').value = 1;
    if(sel.options.length===0){ alert('Cadastre um tipo de EPI no Catálogo antes de registrar movimentações.'); return; }
    openDialog('dlg-mov');
  }
  function openUsuarioNew(){
    document.getElementById('form-usuario').reset();
    document.getElementById('u-papel').value = 'operador';
    openDialog('dlg-usuario');
  }
  var avaliacaoContext = null;
  function openAvaliacao(entregaId){
    avaliacaoContext = entregaId;
    document.getElementById('form-avaliacao').reset();
    document.getElementById('av-data').value = todayISO();
    document.getElementById('av-estado').value = 'bom';
    openDialog('dlg-avaliacao');
  }

  /* ================= Event wiring (delegated, attached once) ================= */
  function wireEvents(){
    document.addEventListener('click', function(e){
      var t = e.target.closest('[data-action]');
      if(!t) return;
      var action = t.dataset.action;
      var id = t.dataset.id;
      if(action==='set-tab'){ state.tab = t.dataset.tab; state.fichaId=null; render(); }
      else if(action==='open-ficha'){ state.fichaId = id; render(); }
      else if(action==='close-ficha'){ state.fichaId = null; render(); }
      else if(action==='print-ficha'){ window.print(); }
      else if(action==='desligar'){ registrarDesligamento(id); }
      else if(action==='reativar'){ reativarFuncionario(id); }
      else if(action==='open-func-new'){ openFuncNew(); }
      else if(action==='edit-func'){ openFuncEdit(id); }
      else if(action==='open-epi-new'){ openEpiNew(); }
      else if(action==='edit-epi'){ openEpiEdit(id); }
      else if(action==='open-mov'){ openMov(); }
      else if(action==='close-dialog'){ closeDialog(t.dataset.dlg); }
      else if(action==='toggle-confirmado'){ toggleConfirmado(id); }
      else if(action==='registrar-devolucao'){ registrarDevolucao(id); }
      else if(action==='logout'){ logout(); }
      else if(action==='open-usuario-new'){ openUsuarioNew(); }
      else if(action==='reset-senha'){ resetSenhaUsuario(t.dataset.email); }
      else if(action==='toggle-usuario-ativo'){ toggleUsuarioAtivo(id); }
      else if(action==='open-avaliacao'){ openAvaliacao(id); }
      else if(action==='baixar-backup'){ baixarBackup(); }
      else if(action==='registrar-entrega'){
        var epiId = document.getElementById('entrega-epi').value;
        var qtd = parseInt(document.getElementById('entrega-qtd').value, 10) || 1;
        var data = document.getElementById('entrega-data').value || todayISO();
        if(!epiId){ alert('Selecione o equipamento antes de registrar a entrega.'); return; }
        registrarEntrega({funcionarioId:id, tipoEpiId:epiId, quantidade:qtd, data:data});
        draft.entrega = {tipoEpiId:'', quantidade:1, data:todayISO()};
      }
      else if(action==='salvar-declaracao'){
        var uso = document.getElementById('decl-uso').checked;
        var trei = document.getElementById('decl-treinamento').checked;
        var ddata = document.getElementById('decl-data').value || todayISO();
        salvarDeclaracao(id, uso, trei, ddata);
      }
    });

    document.addEventListener('input', function(e){
      if(e.target.dataset && e.target.dataset.filter){
        state.filters[e.target.dataset.filter] = e.target.value;
        render();
        return;
      }
      if(e.target.id==='entrega-epi'){ draft.entrega.tipoEpiId = e.target.value; }
      if(e.target.id==='entrega-qtd'){ draft.entrega.quantidade = parseInt(e.target.value,10)||1; }
      if(e.target.id==='entrega-data'){ draft.entrega.data = e.target.value; }
    });
    document.addEventListener('change', function(e){
      if(e.target.id==='entrega-epi'){ draft.entrega.tipoEpiId = e.target.value; }
      if(e.target.dataset && e.target.dataset.filterSelect){
        state.filters[e.target.dataset.filterSelect] = e.target.value;
        render();
      }
    });

    document.addEventListener('submit', function(e){
      if(e.target.id==='form-setup'){
        e.preventDefault();
        attemptSetup(
          document.getElementById('s-nome').value.trim(),
          document.getElementById('s-email').value.trim(),
          document.getElementById('s-senha').value,
          document.getElementById('s-senha2').value
        );
      } else if(e.target.id==='form-login'){
        e.preventDefault();
        attemptLogin(document.getElementById('l-email').value.trim(), document.getElementById('l-senha').value);
      }
    });

    document.getElementById('form-usuario').addEventListener('submit', async function(ev){
      ev.preventDefault();
      var nome = document.getElementById('u-nome').value.trim();
      var email = document.getElementById('u-email').value.trim();
      var senha = document.getElementById('u-senha').value;
      var senha2 = document.getElementById('u-senha2').value;
      var papel = document.getElementById('u-papel').value;
      if(!nome || !email || !senha){ alert('Preencha todos os campos.'); return; }
      if(senha.length<6){ alert('A senha deve ter pelo menos 6 caracteres.'); return; }
      if(senha!==senha2){ alert('As senhas não coincidem.'); return; }
      var ok = await createUsuarioAdmin({nome:nome, email:email, senha:senha, papel:papel});
      if(ok) closeDialog('dlg-usuario');
    });

    document.getElementById('form-avaliacao').addEventListener('submit', function(ev){
      ev.preventDefault();
      if(!avaliacaoContext) return;
      var estado = document.getElementById('av-estado').value;
      var data = document.getElementById('av-data').value || todayISO();
      var observacao = document.getElementById('av-observacao').value.trim();
      registrarAvaliacao(avaliacaoContext, {estado:estado, data:data, observacao:observacao});
      avaliacaoContext = null;
      closeDialog('dlg-avaliacao');
    });

    document.getElementById('form-func').addEventListener('submit', function(ev){
      ev.preventDefault();
      var data = {
        nome: document.getElementById('f-nome').value.trim(),
        cpf: document.getElementById('f-cpf').value.trim(),
        matricula: document.getElementById('f-matricula').value.trim(),
        dataAdmissao: document.getElementById('f-admissao').value || null,
        cargo: document.getElementById('f-cargo').value.trim(),
        setor: document.getElementById('f-setor').value.trim(),
      };
      if(!data.nome || !data.cargo || !data.setor) return;
      if(editing.func){ updateFuncionario(editing.func, data); }
      else { createFuncionario(Object.assign({dataDemissao:null, declaracaoUso:false, declaracaoTreinamento:false}, data)); }
      closeDialog('dlg-func');
    });

    document.getElementById('form-epi').addEventListener('submit', function(ev){
      ev.preventDefault();
      var data = {
        nome: document.getElementById('e-nome').value.trim(),
        ca: document.getElementById('e-ca').value.trim(),
        unidade: document.getElementById('e-unidade').value.trim(),
        estoqueAtual: parseInt(document.getElementById('e-estoque').value,10)||0,
        estoqueMinimo: parseInt(document.getElementById('e-minimo').value,10)||0,
        validadeDias: (function(){ var v=document.getElementById('e-validade').value; return v===''? null : (parseInt(v,10)||null); })(),
      };
      if(!data.nome || !data.unidade) return;
      if(editing.epi){ updateTipoEpi(editing.epi, data); }
      else { createTipoEpi(data); }
      closeDialog('dlg-epi');
    });

    document.getElementById('form-mov').addEventListener('submit', function(ev){
      ev.preventDefault();
      var data = {
        tipoEpiId: document.getElementById('m-tipo-epi').value,
        tipo: document.getElementById('m-tipo-mov').value,
        quantidade: parseInt(document.getElementById('m-quantidade').value,10)||1,
        data: document.getElementById('m-data').value || todayISO(),
        motivo: document.getElementById('m-motivo').value.trim(),
      };
      if(!data.tipoEpiId) return;
      registrarMovimentacao(data);
      closeDialog('dlg-mov');
    });
  }
